name: Build FPS Arms APK

on:
  push:
    paths:
      - 'fps-arms/**'
      - '.github/workflows/build-fps-arms.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -sSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip" && rm "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}_export_templates.tpz" && rm "Godot_v${GODOT_VERSION}_export_templates.tpz"
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$TPL"
          # Only the Android templates are needed.
          mv templates/android_* templates/version.txt "$TPL"/ && rm -rf templates

      - name: Build APK
        run: |
          GODOT=~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 \
          VERSION_CODE=${{ github.run_number }} \
          fps-arms/build_apk.sh
          cp fps-arms/build/fps-arms.apk fps-arms.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fps-arms-apk
          path: fps-arms.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fps-arms-v0.1.${{ github.run_number }}" fps-arms.apk \
            --target "${{ github.sha }}" \
            --title "FPS Arms v0.1.${{ github.run_number }}" \
            --notes "Download: tap fps-arms.apk below. Built from ${{ github.ref_name }}." \
            --latest=false
