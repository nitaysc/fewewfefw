name: Build Sunset Rumble APK

on:
  push:
    paths:
      - 'sunset-rumble/**'
      - '.github/workflows/build-sunset-rumble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunset-rumble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sunset-rumble/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web code into Android
        run: |
          npm ci
          npx cap sync android

      - name: Check the game rules
        run: npm test

      - name: Build APK
        working-directory: sunset-rumble/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../sunset-rumble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sunset-rumble-apk
          path: sunset-rumble/sunset-rumble.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sunset-rumble-v1.0.${{ github.run_number }}" sunset-rumble.apk \
            --target "${{ github.sha }}" \
            --title "Sunset Rumble v1.0.${{ github.run_number }}" \
            --notes "Download: tap sunset-rumble.apk below. Built from ${{ github.ref_name }}." \
            --latest=false
