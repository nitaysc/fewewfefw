name: Build MINDGAMES APK

on:
  push:
    paths:
      - 'mindgames/**'
      - '.github/workflows/build-mindgames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindgames
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mindgames/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check puzzle logic (every puzzle has exactly one answer)
        run: npm test

      - name: Build web app and sync into Android
        run: |
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: mindgames/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../mindgames.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mindgames-apk
          path: mindgames/mindgames.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mindgames-v1.0.${{ github.run_number }}" mindgames.apk \
            --target "${{ github.sha }}" \
            --title "MINDGAMES v1.0.${{ github.run_number }}" \
            --notes "Download: tap mindgames.apk below. Built from ${{ github.ref_name }}." \
            --latest=false
