name: Build Whiskers & Coffee APK

on:
  push:
    paths:
      - 'whiskers-coffee/**'
      - '.github/workflows/build-whiskers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whiskers-coffee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whiskers-coffee/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web code into Android
        run: |
          npm ci
          npx cap sync android

      - name: Check the café rules
        run: npm test

      - name: Build APK
        working-directory: whiskers-coffee/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../whiskers-coffee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: whiskers-coffee-apk
          path: whiskers-coffee/whiskers-coffee.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "whiskers-coffee-v0.1.${{ github.run_number }}" whiskers-coffee.apk \
            --target "${{ github.sha }}" \
            --title "Whiskers & Coffee v0.1.${{ github.run_number }}" \
            --notes "Download: tap whiskers-coffee.apk below. Built from ${{ github.ref_name }}." \
            --latest=false
