<!doctype html>
<!-- Renders the app icon: open test/icon.html?layer=full|fg in a browser and screenshot the 1024px canvas. -->
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../www/vendor/three.module.min.js" } }</script>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024" style="width:1024px;height:1024px"></canvas>
<script type="module">
import * as THREE from 'three';
import { makeCar } from '../www/js/render.js';
const layer = new URLSearchParams(location.search).get('layer') || 'full';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(1024, 1024, false);
r.toneMapping = THREE.NeutralToneMapping;
r.shadowMap.enabled = true;
const s = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
const env = new THREE.Scene();
env.background = new THREE.Color('#ff9f73');
const top = new THREE.Mesh(new THREE.SphereGeometry(50, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#6a5fd0', side: THREE.BackSide }));
env.add(top);
s.environment = pm.fromScene(env, 0.03).texture;
s.add(new THREE.HemisphereLight('#e4dcff', '#ffc9a0', 1.8));
const sun = new THREE.DirectionalLight('#ffd2a1', 3); sun.position.set(5, 10, 6); sun.castShadow = true; s.add(sun);
const car = makeCar('comet', '#ef3b36', '');
car.root.rotation.y = 0.75;
car.front.forEach((w) => (w.rotation.y = 0.35));
car.body.rotation.z = -0.04;
s.add(car.root);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.35 }));
shadow.receiveShadow = true; s.add(shadow);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const z = layer === 'fg' ? 14.5 : 10.8;
cam.position.set(0, 4.6, z); cam.lookAt(0, 0.9, 0);
if (layer === 'full') {
  // sunset backdrop with a sun disc
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#5a5fc8'); gr.addColorStop(0.45, '#c98ac9'); gr.addColorStop(0.75, '#ff9f73'); gr.addColorStop(1, '#ffd27a');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#fff1b8'; g.beginPath(); g.arc(256, 190, 70, 0, 7); g.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  s.background = t;
  shadow.material.opacity = 0.3;
}
r.render(s, cam);
window.done = true;
</script></body></html>
