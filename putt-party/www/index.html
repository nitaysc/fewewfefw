<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1a3c">
  <title>Putt Party</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="splash">
    <div class="brand big"><span class="b1">PUTT</span><span class="b2">PARTY</span></div>
    <div class="loader"><i></i></div>
  </div>

  <!-- menu -->
  <section class="layer" id="menu">
    <div class="brand"><span class="b1">PUTT</span><span class="b2">PARTY</span></div>
    <button class="round soundBtn menu-sound" aria-label="צלילים">🔊</button>
    <div class="m-panel">
      <div class="m-sec">
        <h3>מסלול</h3>
        <div class="courses" id="courseList"></div>
      </div>
      <div class="m-sec two">
        <div>
          <h3>יריבים</h3>
          <div class="stepper"><button id="botsPlus">+</button><b id="botsVal">2</b><button id="botsMinus">−</button></div>
        </div>
        <div>
          <h3>רמת בוטים</h3>
          <div class="seg" id="skillSeg"><button data-v="easy">קל</button><button data-v="medium">בינוני</button><button data-v="hard">קשה</button></div>
        </div>
      </div>
      <div class="m-sec">
        <h3>הכדור שלך</h3>
        <input id="nameInput" maxlength="12" placeholder="השם שלך">
        <div class="colors" id="colors"></div>
        <div class="hats" id="hats"></div>
      </div>
    </div>
    <button class="play" id="play"><span>שחק</span><i>▶</i></button>
  </section>

  <!-- in-game HUD -->
  <section class="layer" id="hud">
    <div class="hole-badge">
      <div class="num"><small>גומה</small><b id="holeNum">1</b></div>
      <div class="info"><b id="holeName"></b><span id="holePar"></span></div>
      <div class="strokes" id="strokes"></div>
    </div>
    <ul class="players" id="players"></ul>
    <div class="top-btns">
      <button class="round" id="pauseBtn" aria-label="השהיה">❚❚</button>
      <button class="round" id="overviewBtn" aria-label="מבט על">🗺️</button>
    </div>
    <div class="cam-btns">
      <button class="round big" id="rotL" aria-label="סובב שמאלה">⟲</button>
      <button class="round big" id="rotR" aria-label="סובב ימינה">⟳</button>
    </div>
    <div class="side-btns">
      <button class="pill" id="resetBtn" hidden>↺ החזר כדור +1</button>
      <button class="pill" id="fastBtn" hidden>⏩ הרץ מהר</button>
    </div>
    <div id="power"><div class="bar"><i id="powerFill"></i></div><b id="powerPct">0%</b></div>
    <div id="teach" hidden>
      <div class="hand">👆</div>
      <p><b>גוררים אחורה</b> מכל מקום במסך<br>ומשחררים כדי לחבוט</p>
    </div>
  </section>

  <div id="holeCard"></div>
  <div id="banner"></div>
  <div id="toast"></div>

  <!-- end of hole -->
  <section class="layer dim" id="holeEnd">
    <div class="sheet">
      <h2 id="holeEndTitle"></h2>
      <div id="holeEndTable" class="card-wrap"></div>
      <button class="cta" id="nextHole"></button>
    </div>
  </section>

  <!-- final results -->
  <section class="layer dim" id="final">
    <div class="sheet wide">
      <div class="final-top">
        <div>
          <h2 id="finalTitle"></h2>
          <p class="sub" id="finalSub"></p>
        </div>
        <div class="podium" id="podium"></div>
      </div>
      <div id="finalTable" class="card-wrap"></div>
      <div class="row-btns"><button class="cta" id="again">שוב! 🔁</button><button class="cta ghost" id="toMenu">תפריט</button></div>
    </div>
  </section>

  <!-- pause -->
  <section class="layer dim" id="pause">
    <div class="sheet narrow">
      <h2>הפסקה</h2>
      <button class="cta" id="resume">המשך ▶</button>
      <button class="cta ghost" id="restart">מהתחלה 🔁</button>
      <button class="cta ghost" id="quit">יציאה לתפריט</button>
      <button class="round soundBtn" aria-label="צלילים">🔊</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
