<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<!--head-->
<title>Rookwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2c2b28">
<link rel="stylesheet" href="css/piece-previews.css">
<link rel="stylesheet" id="pieceCss" href="css/pieces-staunty.css">
<link rel="stylesheet" href="css/app.css">
<script>
// apply the saved look and piece set before the first paint
try {
  var saved = JSON.parse(localStorage.getItem('rw.settings') || '{}');
  if (localStorage.getItem('rw.style') === '2') {
    if (saved.look) document.documentElement.setAttribute('data-look', saved.look);
    if (saved.pieces) document.getElementById('pieceCss').href = 'css/pieces-' + saved.pieces + '.css';
  }
} catch (e) {}
// The Android app draws edge to edge and tells the page how big the status and navigation bars are
// (MainActivity.java). The last sizes are kept so the first paint already leaves room for them.
window.__rwInsets = function (t, r, b, l, kb) {
  var st = document.documentElement.style;
  st.setProperty('--sat', t + 'px'); st.setProperty('--sar', r + 'px'); st.setProperty('--sab', b + 'px');
  st.setProperty('--sal', l + 'px'); st.setProperty('--kb', (kb || 0) + 'px');
  try { localStorage.setItem('rw.insets', JSON.stringify([t, r, b, l])); } catch (e) {}
  if (window.__rw && window.__rw.fit) window.__rw.fit();
};
try {
  var ins = JSON.parse(localStorage.getItem('rw.insets') || 'null');
  if (ins) window.__rwInsets(ins[0], ins[1], ins[2], ins[3], 0);
} catch (e) {}
</script>
<!--/head-->
</head>
<body>
<!--body-->
<div id="app">

  <!-- Play tab -->
  <section class="screen tab" id="home">
    <header class="topbar">
      <span class="mark" data-art="mark"></span>
      <h1>Rookwise</h1>
      <span class="lvl" id="lvlChip" hidden></span>
    </header>

    <div class="rows" id="resumeRows">
      <button class="row" id="resumeBtn" hidden>
        <span class="mini-wrap" id="resumeBoard"></span>
        <span class="row-txt"><b>Continue your game</b><small id="resumeInfo"></small></span>
        <span class="chev" data-ic="next"></span>
      </button>
    </div>

    <section class="card hero" id="hero">
      <div class="hero-top">
        <span class="avatar xl" id="heroAv"></span>
        <div class="hero-id">
          <b id="heroName"></b>
          <span class="elo" id="heroElo"></span>
          <p class="quote" id="botLine"></p>
        </div>
      </div>
      <div class="carousel" id="bots" role="radiogroup" aria-label="Opponent"></div>
      <div class="seg" id="colorSeg" role="radiogroup" aria-label="Your color">
        <button data-v="w" role="radio"><span class="pc wk"></span>White</button>
        <button data-v="r" role="radio"><span class="dice"></span>Random</button>
        <button data-v="b" role="radio"><span class="pc bk"></span>Black</button>
      </div>
    </section>

    <div class="rows" id="homeRows">
      <button class="row" id="dailyRow">
        <span class="mini-wrap" id="dailyBoard"></span>
        <span class="row-txt"><b>Daily Puzzle</b><small id="dailyInfo"></small></span>
        <span class="chev" data-ic="next"></span>
      </button>
      <button class="row" id="lastRow" hidden>
        <span class="mini-wrap" id="lastBoard"></span>
        <span class="row-txt"><b>Review your last game</b><small id="lastInfo"></small></span>
        <span class="chev" data-ic="next"></span>
      </button>
    </div>

    <section class="card stats" id="homeStats"></section>

    <div class="cta"><button class="primary big" id="playBtn"><span>Play</span><small id="playSub"></small></button></div>
  </section>

  <!-- Puzzles tab -->
  <section class="screen tab" id="puzzles" hidden>
    <header class="topbar">
      <h1>Puzzles</h1>
    </header>
    <section class="card pzhero" id="pzHero"></section>
    <div class="pzmodes" id="pzModes"></div>
    <h2>Practice a theme</h2>
    <div class="themes" id="pzThemes"></div>
    <div class="pzfoot"></div>
  </section>

  <!-- Games tab -->
  <section class="screen tab" id="games" hidden>
    <header class="topbar">
      <h1>Games</h1>
      <button class="pill" id="pgnBtn">Import PGN</button>
    </header>
    <section class="card stats" id="gamesStats"></section>
    <div class="list" id="gameList"></div>
  </section>

  <!-- Settings tab -->
  <section class="screen tab" id="prefs" hidden>
    <header class="topbar"><h1>Settings</h1></header>
    <div class="prefs" id="prefsBody"></div>
  </section>

  <nav class="tabnav" id="tabnav" aria-label="Sections">
    <button data-tab="home"><i data-ic="play"></i>Play</button>
    <button data-tab="puzzles"><i data-ic="puzzle"></i>Puzzles</button>
    <button data-tab="games"><i data-ic="games"></i>Games</button>
    <button data-tab="prefs"><i data-ic="gear"></i>Settings</button>
  </nav>

  <!-- Game -->
  <section class="screen fit" id="game" hidden>
    <header class="bar">
      <button class="icon" id="gameBack" aria-label="Back to menu" data-ic="back"></button>
      <span class="bar-title" id="gameTitle">Game</span>
      <button class="icon voice-btn" aria-label="Coach voice"></button>
      <button class="icon" id="gameSettings" aria-label="Settings" data-ic="gear"></button>
    </header>
    <div class="player" id="gTop"></div>
    <div class="board-area">
      <div class="board-row" id="gRow">
        <div class="evalbar" id="gEval" hidden><div class="fill"></div><span class="num"></span></div>
        <div class="board" id="gBoard"></div>
      </div>
    </div>
    <div class="player" id="gBot"></div>
    <div class="coach slim">
      <span class="coach-av" id="gAv"></span>
      <div class="bubble" id="gBubble">
        <div class="bubble-body">
          <b id="gTitle"></b><p id="gText"></p>
          <p class="note" id="gNote"></p><p class="warn" id="gWarn"></p><p class="tip" id="gTip"></p>
        </div>
        <div class="bubble-acts" id="gActs"></div>
      </div>
    </div>
    <div class="moves" id="gMoves"></div>
    <nav class="toolbar">
      <button id="resignBtn"></button>
      <button id="undoBtn"></button>
      <button id="explainBtn"></button>
      <button id="hintBtn"></button>
    </nav>
  </section>

  <!-- Puzzle -->
  <section class="screen fit" id="puzzle" hidden>
    <header class="bar">
      <button class="icon" id="pzBack" aria-label="Back to puzzles" data-ic="back"></button>
      <span class="bar-title" id="pzTitle">Puzzles</span>
      <button class="icon" id="pzFlip" aria-label="Flip board" data-ic="flip"></button>
      <button class="icon" id="pzSettings" aria-label="Settings" data-ic="gear"></button>
    </header>
    <div class="pzstrip" id="pzStrip"></div>
    <div class="board-area">
      <div class="board-row">
        <div class="board" id="pBoard"></div>
      </div>
    </div>
    <div class="rushrow" id="pzRushRow" hidden></div>
    <div class="coach slim">
      <span class="coach-av" id="pzAv"></span>
      <div class="bubble" id="pzBubble">
        <div class="bubble-body">
          <b id="pzHead"></b><p id="pzText"></p><p class="tip" id="pzTip"></p>
        </div>
        <div class="bubble-acts" id="pzActs"></div>
      </div>
    </div>
    <nav class="toolbar" id="pzTools"></nav>
  </section>

  <!-- Review -->
  <section class="screen fit" id="review" hidden>
    <header class="bar">
      <button class="icon" id="revBack" aria-label="Back" data-ic="back"></button>
      <span class="bar-title">Game Review</span>
      <button class="icon voice-btn" aria-label="Coach voice"></button>
      <button class="icon" id="revSummaryBtn" aria-label="Summary" data-ic="chart"></button>
    </header>

    <div class="rev-pane" id="revLoading">
      <div class="pring" id="revRing">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="val" id="revRingVal" cx="60" cy="60" r="52"/></svg>
        <span class="coach-av" id="lAv"></span>
      </div>
      <b class="pring-pct" id="revPctNum">0%</b>
      <p class="pring-msg" id="revLoadMsg">I'm checking every move with the engine.</p>
      <p class="fine" id="revPct"></p>
    </div>

    <div class="rev-pane scroll" id="revSummary" hidden></div>

    <div class="rev-pane steps" id="revSteps" hidden>
      <div class="coach slim">
        <span class="coach-av" id="rAv"></span>
        <div class="bubble" id="rBubble">
          <div class="bubble-body">
            <span class="ev-chip" id="rEvChip"></span><b id="rTitle"></b><p id="rText"></p>
            <p class="tip" id="rTip"></p>
          </div>
          <div class="bubble-acts" id="rActs"></div>
        </div>
      </div>
      <div class="board-area">
        <div class="board-row">
          <div class="evalbar" id="rEval"><div class="fill"></div><span class="num"></span></div>
          <div class="board" id="rBoard"></div>
        </div>
      </div>
      <div class="graph" id="rGraph"></div>
      <div class="moves" id="rMoves"></div>
      <div class="rev-acts">
        <button class="ghost" id="rRetry">Retry</button>
        <button class="ghost" id="rBest">Show best</button>
        <button class="primary" id="rNextKey">Next key move</button>
      </div>
      <nav class="toolbar nav5">
        <button id="rFirst" aria-label="First move" data-ic="first"></button>
        <button id="rPrev" aria-label="Previous move" data-ic="prev"></button>
        <button id="rFlip" aria-label="Flip board" data-ic="flip"></button>
        <button id="rNext" aria-label="Next move" data-ic="next"></button>
        <button id="rLast" aria-label="Last move" data-ic="last"></button>
      </nav>
    </div>
  </section>

  <!-- Sheets -->
  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script src="vendor/chess.js"></script>
<script src="js/util.js"></script>
<script src="js/openings.js"></script>
<script src="js/engine.js"></script>
<script src="js/review.js"></script>
<script src="js/coach.js"></script>
<script src="js/avatars.js"></script>
<script src="js/sounds-map.js"></script>
<script src="js/sound.js"></script>
<script src="js/voice.js"></script>
<script src="js/board.js"></script>
<script src="js/puzzles-data.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/puzzle-screen.js"></script>
<script src="js/app.js"></script>
<!--/body-->
</body>
</html>
