<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#6b4a33">
<canvas id="c"></canvas>
<script type="module">
// Sprite preview: every cat frame in every coat, and people in several looks.
import { catFrame, CAT_FRAMES, COATS } from '../www/js/art/cats.js';
import { personSprite, randomLook } from '../www/js/art/people.js';
const S = 6, c = document.getElementById('c'), g = c.getContext('2d');
c.width = 1700; c.height = 1100; g.imageSmoothingEnabled = false;
let y = 10;
for (const coat of Object.keys(COATS)) {
  let x = 10;
  for (const f of CAT_FRAMES) { const s = catFrame(f, coat); g.drawImage(s.canvas, x, y, s.w * S, s.h * S); x += s.w * S + 12; }
  y += 15 * S + 6; if (y > 600) break;
}
let seed = 3; const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const looks = [{ skin: '#f6d7b8', hair: '#5a3a26', style: 'bob', shirt: '#3d4a6b', pants: '#2f3f4a' }];
for (let i = 0; i < 7; i++) looks.push(randomLook(r));
let x = 10; y = 640;
for (const look of looks) {
  for (const [view, fr] of [['front', 4], ['front', 1], ['back', 0], ['front', 6]]) {
    const s = personSprite(look, view, fr, false); g.drawImage(s.canvas, x, y, s.w * 5, s.h * 5); x += s.w * 5 + 4;
  }
  x += 16; if (x > 1500) { x = 10; y += 160; }
}
window.done = true;
</script>
