apply plugin: 'com.android.application'

// CI passes -PversionCode=<run number> so each new APK installs over the previous one
def buildNumber = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'io.github.nitaysc.redeclipse'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.nitaysc.redeclipse'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "2.0.0-android.${buildNumber}"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            // the engine is far too slow unoptimised, so even "debug" APKs are optimised
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // the game data ships as one zip that the launcher unpacks on first start
    androidResources {
        noCompress 'zip'
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
